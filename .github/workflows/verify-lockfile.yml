# Fails when .github/workflows/actions.lock is out of sync with the workflows,
# or a locked pin no longer verifies upstream.
# After changing any `uses:` line, run `gh actions-lock` and commit the lockfile.
# https://docs.github.com/actions/concepts/security/workflow-dependency-lockfiles

name: Verify lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
